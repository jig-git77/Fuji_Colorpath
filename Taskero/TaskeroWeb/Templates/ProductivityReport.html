<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <title>Untitled Page</title>
    <link href="#csspath#" rel="stylesheet" type="text/css" />
    <style>
        table td {
            padding: 2px;
        }
    </style>
</head>
<body>
    <div style="width: 100%; height: 800px">
        <div style="width: 100%; height: 0px">
            &nbsp;</div>
       <table style="width: 99%;" cellspacing="0" cellpadding="0" border="0" align="center" class="TABLE2">
            <tr>
                <td class="TITLE2" valign="middle" align="left">
                    Productivity Report</td>
            </tr>
            <tr>
                <td class="BOLD1" valign="middle" align="left">
                    <table width="100%">                        
                        <tr>
                            <td rowspan="2"><!--<img src="##IMAGES##FFLogo1.png" />--></td>
                            <td align="Center" style="WIDTH:90%"> ##DongleName## &nbsp; Productivity Report&nbsp;</td>
                            <td rowspan="2"><img src="##IMAGES##powered-by.gif" align="right" /></td>
                        </tr>
                        <tr>
                            <td align="right">
                                <table width="100%">
                                    <tr>
                                        <td align="right" width="52%">
                                            ##CompanyName##</td>
                                        
                                        <td align="left" width="48%">
                                            ##BranchName##</td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <td valign="middle" align="left">
                    <strong>&nbsp;&nbsp;&nbsp;Date:</strong> ##DateRange##</td>
            </tr>
            <tr>
                <td>
                    &nbsp;</td>
            </tr>
            <tr>
                <td>
                    <table style="width: 99%; border: 1PX SOLID #C1C1C1;" cellspacing="0" cellpadding="0"
                        border="0" align="center">
                        <tr>
                            <td style="width: 20%" class="GRIDTITLE" align="center">
                                Search Field</td>
                            <td style="width: 20%" class="GRIDTITLE" align="center">
                                Operator</td>
                            <td style="width: 20%" class="GRIDTITLE" align="center">
                                Criteria</td>
                        </tr>
                        ##SearchCriteria##
                    </table>
                </td>
            </tr>
           <tr><td style="height:5px">&nbsp;</td></tr>
            <tr>
                <td>
                    <table style="width: 99%; border: 1PX SOLID #C1C1C1;" cellspacing="0" cellpadding="0"
                        border="0" align="center">
                        <tr class="GRIDTITLE">
                            <td colspan="5" align="left">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <table style="width: 100%" cellspacing="0" cellpadding="0" border="0">
                                    <tr class="GRIDTITLE">
                                        <td style="width: 15%" class="GRIDTITLE" align="left">
                                            Branch</td>
                                        <td style="width: 20%" class="GRIDTITLE" align="left">
                                            Dongle</td>
                                        <td style="width: 9%" class="GRIDTITLE" align="center">
                                            Category</td>
                                        <td style="width: 10%" class="GRIDTITLE" align="center">
                                            Measurements</td>
                                        <td style="width: 9%" class="GRIDTITLE" align="center">
                                            Unique Jobs</td>
                                        <td style="width: 6%" class="GRIDTITLE" align="center">
                                            No Job</td>
                                        <td style="width: 7%" class="GRIDTITLE" align="center">
                                            Reruns</td>
                                        <td style="width: 6%" class="GRIDTITLE" align="center">
                                            Error Rate</td>
                                        <td style="width: 10%" class="GRIDTITLE" align="center">
                                            Red State</td>
                                        <td style="width: 15%" class="GRIDTITLE" align="center">
                                            Red State Precentage</td>
                                     
                                    </tr>
                                    ##Productivity##
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr><td>&nbsp;</td></tr>
        </table>
    </div>
</body>
</html>
