<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>

    <title>Untitled Document</title>
    <link href="#csspath#" rel="stylesheet" type="text/css" />
    <style>
        table td {
            padding: 2px;
        }
    </style>
</head>
<body>
    <div style="width: 100%; height: 800px">

        <table width="100%" border="0" cellspacing="0" cellpadding="0">

                <td align="center">
                    <table width="99%" border="0" cellspacing="0" cellpadding="0">
                        <tr>
                            <td>
                                <table width="100%" style="border-right: #c1c1c1 1px solid; border-top: #c1c1c1 1px solid;

                                        <td class="GRIDTITLE" colspan="3" align="left">
                                            Device 1 : ##LBL_Device1##

                                    </tr>

                                        <td>

                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td align="center">
                                <table cellspacing="5" cellpadding="0" align="center" border="0" width="100%">
                                    <tr>

                                            </table>
                                        </td>

                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
