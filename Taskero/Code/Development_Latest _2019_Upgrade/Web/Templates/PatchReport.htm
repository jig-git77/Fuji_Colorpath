<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <title>Untitled Document</title>
    <link href="#csspath#" rel="stylesheet" type="text/css" />    
    <style>
        .tableStyle td {
            padding: 2px;
        }
    </style>
</head>
<body>
    <div style="width: 100%;">
        <div style="width: 100%; height: 0px">
            &nbsp;</div>
        <table width="100%" border="0" cellspacing="0" cellpadding="0">
            <tr>
                <td align="center">
                    <table class="TABLE2" width="100%" border="0" cellspacing="0" cellpadding="0">
                        <tr>
                            <td>
                                <table width="100%" border="0" cellspacing="0" cellpadding="0">
                                    <tr>
                                        <td width="100%" align="left" class="TITLE2">
                                            Patch Detail Report
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td valign="top">
                                <table style="width: 100%" cellspacing="0" cellpadding="0" border="0" align="center">
                                    <tr>
                                        <td class="ReportHeader" colspan="3" align="center">
                                            ###ReportHeader###
                                        </td>
                                    </tr>
                                    <tr>
                                        <td colspan="3">
                                            <table style="width: 99%; border: 1PX SOLID #C1C1C1;" cellspacing="0" cellpadding="0"
                                                border="0" align="center" class="tableStyle">
                                                <tr>
                                                    <td class="GRIDTITLE" align="left" colspan="3">
                                                        Summary
                                                    </td>
                                                </tr>
                                                <tr class="GRIDODD">
                                                    <td class="BOLD1" align="left" width="20%">
                                                        Date Range
                                                    </td>
                                                    <td align="left">
                                                        ##DateRange##
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td colspan="3">
                                            &nbsp;
                                        </td>
                                    </tr>
                                    <tr>
                                        <td colspan="3">
                                            <table style="width: 99%; border: 1PX SOLID #C1C1C1" cellspacing="0" cellpadding="0"
                                                border="0" align="center" class="tableStyle">
                                                <tr>
                                                    <td style="width: 35%" class="GRIDTITLE" align="center">
                                                        Search Field
                                                    </td>
                                                    <td style="width: 30%" class="GRIDTITLE" align="center">
                                                        Operator
                                                    </td>
                                                    <td style="width: 35%" class="GRIDTITLE" align="center">
                                                        Criteria
                                                    </td>
                                                </tr>
                                                ##SearchCriteria##
                                            </table>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            &nbsp;
                                        </td>
                                    </tr>
                                    <tr>
                                        <td colspan="5">
                                            <table style="width: 99%" cellspacing="0" cellpadding="0" border="0" align="center"  class="tableStyle">
                                                <tr>
                                                    <td colspan="5">
                                                        ##PatchDetail##
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
