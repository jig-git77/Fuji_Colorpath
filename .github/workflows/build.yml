name: Build
on:
  push:
    branches:
      - feature/sonar
jobs:
  build:
    name: Build
    runs-on: windows-2019
    steps:
      - name: Set up JDK 17.0.10
        uses: actions/setup-java@v1
        with:
          java-version: 17.0.10
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarCloud packages
        uses: actions/cache@v1
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.2.0
      - name: Restore NuGet packages
        run: nuget restore Sync/Code/Development_1D/FujifilmUSA.Sync.sln -PackagesDirectory packages
      - name: Build and analyze
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"${{ secrets.SONAR_KEY }}" /d:sonar.host.url="${{ secrets.SONAR_HOST }}" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          dotnet build Sync/Code/Development_1D/FujifilmUSA.Sync.sln
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
