    <title>Color Organizer IFrame Test NEW FF Browser</title>
    <script type="text/javascript">
        $(function () {
            $('#button').click(function () {

                    $('#iframeHolder').html('<iframe id="iframe" src="' + url + '" width="700" height="450"></iframe>');
                }
            });
        });
    </script>
